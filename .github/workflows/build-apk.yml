name: Сборка Release APK и публикация релиза (Финансист 3.6)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Настройка Java 17 для Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Сборка веб-ресурсов, инициализация Capacitor и замена иконок
        run: |
          npm install
          node prepare-www.mjs
          npx cap add android
          npx cap sync android
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png" || true
              cp icon-512.png "$dir/ic_launcher_round.png" || true
              cp icon-512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Установка постоянного ключа подписи и версии 3.6 Release
        env:
          RUN_NUM: ${{ github.run_number }}
          STATIC_KEY_B64: ""
        run: |
          mkdir -p ~/.android
          echo "$STATIC_KEY_B64" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/app/financier-release.keystore

          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const code = 360 + (Number(process.env.RUN_NUM) || 1);
            const ver = "3.6." + (process.env.RUN_NUM || "1");
            g = g.replace(/versionCode\s+\d+/, "versionCode " + code);
            g = g.replace(/versionName\s+"[^"]*"/, `versionName "${ver}"`);
            g = g.replace(/buildTypes\s*\{\s*release\s*\{/, "buildTypes {\n        release {\n            signingConfig signingConfigs.debug");
            fs.writeFileSync(p, g);
            console.log("Patched build.gradle with versionCode=" + code + ", versionName=" + ver);
          '

          node -e '
            const fs = require("fs");
            const mp = "android/app/src/main/AndroidManifest.xml";
            let m = fs.readFileSync(mp, "utf8");
            if (!m.includes("android.permission.VIBRATE")) {
              m = m.replace("<application", `<uses-permission android:name="android.permission.VIBRATE" />\n    <application`);
              fs.writeFileSync(mp, m);
            }
          '

      - name: Компиляция подписанного Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk ../Financier-release.apk

      - name: Выгрузка Financier-release.apk в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Financier-3.6-Release-APK
          path: Financier-release.apk

      - name: Автоматическая публикация в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.${{ github.run_number }}
          name: "Финансист v3.6.${{ github.run_number }} Release"
          body: "Автоматическая релизная сборка Финансист 3.6 (Android 2026). Подписана единым постоянным ключом — устанавливается поверх предыдущей версии без удаления данных."
          draft: false
          prerelease: false
          make_latest: true
          files: Financier-release.apk
